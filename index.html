<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>2D Games</h1>
        <p>Venda de Jogos!!!</p>
    </header>

    <main class="container">
        <div class="titulo-secao">
            <div>
                <h2>Nosso catálogo!</h2>
                <p>Conheça os jogos disponíveis</p>
            </div>

            <button id="btnCadastrar" type="button">Cadastrar jogo</button>
        </div>
        <div class="lista-jogo">
            <div class="jogos">
                <img src="images.jpg" alt="ufc" class="imagemjogo">
                <h3>UFC 6</h3>
                <P>Preço: $150,00</P>
                <button type="button">VER JOGOS</button>
            </div>
        </div>
        <div class="listar-jogos">
            <div class="jogos">
                <img src="Grand_Theft_Auto_V_capa.png" alt="gta" class="imagemjogo">
                <h3>GTA 5</h3>
                <P>Preço: $100,00</P>
                <button type="button">VER JOGOS</button>
            </div>
        </div>
          <div class="listar-jogos">
            <div class="jogos">
                <img src="images (1).jpg" alt="F1" class="imagemjogo">
                <h3>F1</h3>
                <P>Preço: $180,00</P>
                <button type="button">VER JOGOS</button>
            </div>
        </div>

        <section id="listarJogo" class="listar-jogo">
            <p id="mensagemVazia">Nenhum jogo cadastrado</p>
        </section>
    </main>

    <dialog id="modalCadastro">
        <h2>Novo jogo</h2>

        <form id="formDisco">
            <label for="jogo">Nome do jogo</label>
            <input type="text" id="jogo" placeholder="Jogo" required>

            <label for="empresa">Empresa</label>
            <input type="text" id="empresa" placeholder="Empresa" required>

            <label for="genero">Gênero do jogo</label>
            <input type="text" id="genero" placeholder="Gênero" required>

            <label for="imagem">URL da imagem</label>
            <input type="url" id="imagem" placeholder="https://site.com/capa.jpg" required>

            <label for="preco">Preço (R$)</label>
            <input type="number" id="preco" min="0.01" step="0.01" required>

            <div class="acoes">
                <button type="button" id="btnCancelar" class="cancelar">Cancelar</button>
                <button type="submit">Salvar Jogo</button>
            </div>
        </form>
    </dialog>

    <script src="script.js"></script>
</body>
</html>
